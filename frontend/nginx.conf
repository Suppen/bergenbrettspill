map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

server {
	listen 80;
	listen [::]:80;

	server_name localhost;

	root /usr/share/nginx/html;
	index index.html;

	ssi on;

	# Configurable redirect for /stem
	location /stem {
		return 302 ${VOTE_REDIRECT_URL};
	}

	# Proxy API requests to backend
	location ~ /api/ {
		proxy_pass ${BACKEND_URL};
		proxy_set_header Host $host;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		rewrite ^/api/(.*)$ /$1 break;
	}

	# Norske filnavn: rewrite gamle URL-er til de nye
	location = /membership {
		return 301 $scheme://$http_host/medlemskap.html;
	}
	location = /membership.html {
		return 301 $scheme://$http_host/medlemskap.html;
	}
	location = /where.html {
		return 301 $scheme://$http_host/hvor.html;
	}
	location = /games.html {
		return 301 $scheme://$http_host/spill.html;
	}

	location / {
		try_files $uri $uri/ @html;
	}

	# /medlemskap -> 301 /medlemskap.html, 404 hvis .html-filen ikke finnes
	location @html {
		if (-f $document_root$uri.html) {
			return 301 $scheme://$http_host$uri.html;
		}
		return 404;
	}
}
